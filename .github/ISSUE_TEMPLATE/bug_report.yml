name: Bug report
description: Report a reproducible problem in the Windows beta
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "如需发送多张截图或较完整的相关信息，建议邮件联系 [aiyuling.usm@gmail.com](mailto:aiyuling.usm@gmail.com?subject=%5BLiterature%20Agent%20RC3%5D%20Feedback)。提交前请删除 API keys、SMTP passwords、private paper content 和个人信息；安全问题请勿公开提交。"
  - type: input
    id: version
    attributes:
      label: Literature Agent version
      placeholder: "0.3.0-rc.3"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows and browser versions
      placeholder: "Windows 11 24H2; Edge 140"
    validations:
      required: true
  - type: input
    id: run
    attributes:
      label: Run ID (if relevant)
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "Start from a fresh launch and list each action."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted screenshot or log excerpt
      description: "Attach only sanitized evidence."
