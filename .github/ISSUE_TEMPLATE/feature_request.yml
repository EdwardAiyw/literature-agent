name: Feature request
description: Suggest an improvement for a future version
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Current workflow and suggested behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you have tried
