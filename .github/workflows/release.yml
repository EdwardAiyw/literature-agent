name: Windows Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build without moving it
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create release environment
        shell: pwsh
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install -e "./backend[dev,release]"
          choco install innosetup --no-progress -y
      - name: Test backend
        working-directory: backend
        run: .venv/Scripts/python.exe -m pytest -q
      - name: Install frontend dependencies and Edge browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install msedge
      - name: Build frontend and run browser regression
        working-directory: frontend
        run: |
          npm run build
          npm run test:e2e
      - name: Build installer
        shell: pwsh
        run: |
          $tag = "${{ inputs.release_tag || github.ref_name }}"
          $version = $tag.TrimStart('v')
          .\scripts\build-windows-release.ps1 -Version $version
      - name: Smoke test packaged runtime
        shell: pwsh
        run: |
          $version = "${{ inputs.release_tag || github.ref_name }}".TrimStart('v')
          $env:LITERATURE_AGENT_DATA_DIR = Join-Path $env:RUNNER_TEMP "packaged-smoke-$version"
          $env:LITERATURE_AGENT_BOOTSTRAP = Join-Path $env:RUNNER_TEMP "packaged-bootstrap-$version.json"
          $env:LITERATURE_AGENT_LIVE = "false"
          $env:LLM_MODEL = ""
          $env:SMTP_HOST = ""
          $env:JEV_ENABLED = "false"
          if (Get-NetTCPConnection -LocalPort 8012 -State Listen -ErrorAction SilentlyContinue) { throw "Smoke test port is occupied" }
          $appPath = (Resolve-Path "release/stage/LiteratureAgent/LiteratureAgent.exe").Path
          $app = Start-Process -FilePath $appPath -ArgumentList @("--port", "8012", "--no-browser") -WindowStyle Hidden -PassThru
          try {
            $health = $null
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try { $health = Invoke-RestMethod "http://127.0.0.1:8012/api/health" -TimeoutSec 2; break }
              catch { Start-Sleep -Seconds 1 }
            }
            if (-not $health -or $health.status -ne "ok" -or $health.version -ne $version) { throw "Packaged runtime health/version check failed" }
            if ([IO.Path]::GetFullPath($health.database.path) -ne [IO.Path]::GetFullPath((Join-Path $env:LITERATURE_AGENT_DATA_DIR "literature_agent_v2.db"))) { throw "Packaged runtime used the wrong database" }
            $prompts = Invoke-RestMethod "http://127.0.0.1:8012/api/prompts"
            if (@($prompts | Where-Object builtin).Count -ne 8 -or @($prompts | Where-Object { $_.active -and $_.version -eq "v2" }).Count -ne 4) { throw "Packaged Prompt v2 catalog check failed" }
            $settings = Invoke-RestMethod "http://127.0.0.1:8012/api/settings"
            if ($settings.version -ne $version -or $settings.zotero_collection_name -ne "Literature Agent") { throw "Packaged Zotero settings check failed" }
            if ($settings.journal_metrics_auto -ne $true) { throw "Packaged automatic JIF default check failed" }
            $env:PACKAGED_SMOKE_DB = Join-Path $env:LITERATURE_AGENT_DATA_DIR "literature_agent_v2.db"
            python -c "import os,sqlite3; c=sqlite3.connect(os.environ['PACKAGED_SMOKE_DB']); assert c.execute('SELECT version_num FROM alembic_version').fetchone()[0]=='20261018_0006'; assert c.execute('SELECT count(*) FROM digest_history').fetchone()[0]==0"
            if ($LASTEXITCODE -ne 0) { throw "Packaged digest history migration check failed" }
            $page = Invoke-WebRequest "http://127.0.0.1:8012/"
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch 'src="/assets/') { throw "Packaged frontend check failed" }
            $taskBody = @{ name = "Packaged conversion smoke"; topic = "retrieval augmented generation"; sources = @("openalex"); date_from = "2023-01-01"; date_to = "2026-10-15"; target_count = 5; origin = "test" } | ConvertTo-Json
            $task = Invoke-RestMethod "http://127.0.0.1:8012/api/tasks" -Method Post -ContentType "application/json" -Body $taskBody
            $schedule = @{ recipient = "smoke@example.org"; schedule_time = "08:00"; timezone = "Asia/Hong_Kong" } | ConvertTo-Json
            $subscription = Invoke-RestMethod "http://127.0.0.1:8012/api/tasks/$($task.id)/subscription" -Method Post -ContentType "application/json" -Body $schedule
            if ($subscription.task_id -ne $task.id -or $subscription.date_from -ne "2023-01-01" -or $subscription.date_to -ne "2026-10-15" -or $subscription.target_count -ne 5) { throw "Packaged task conversion did not preserve research settings" }
            if ($subscription.date_to_mode -ne "today" -or $subscription.zotero_auto_import -ne $false) { throw "Packaged subscription policy check failed" }
            $fixed = Invoke-RestMethod "http://127.0.0.1:8012/api/subscriptions/$($subscription.id)" -Method Patch -ContentType "application/json" -Body '{"date_to_mode":"fixed","target_count":10}'
            if ($fixed.date_to_mode -ne "fixed" -or $fixed.target_count -ne 10) { throw "Packaged fixed cutoff check failed" }
            $dynamic = Invoke-RestMethod "http://127.0.0.1:8012/api/subscriptions/$($subscription.id)" -Method Patch -ContentType "application/json" -Body '{"date_to_mode":"today"}'
            if ($dynamic.date_to_mode -ne "today" -or $dynamic.target_count -ne 10) { throw "Packaged running-day cutoff check failed" }
            $runs = Invoke-RestMethod "http://127.0.0.1:8012/api/tasks/$($task.id)/runs"
            $deliveries = Invoke-RestMethod "http://127.0.0.1:8012/api/deliveries"
            if (@($runs).Count -ne 0 -or @($deliveries).Count -ne 0) { throw "Packaged conversion unexpectedly started a run or delivery" }
            Invoke-RestMethod "http://127.0.0.1:8012/api/subscriptions/$($subscription.id)" -Method Delete | Out-Null
          } finally {
            Get-NetTCPConnection -LocalPort 8012 -State Listen -ErrorAction SilentlyContinue | Select-Object -ExpandProperty OwningProcess -Unique | ForEach-Object { Stop-Process -Id $_ -ErrorAction SilentlyContinue }
            Stop-Process -Id $app.Id -ErrorAction SilentlyContinue
          }
      - name: Create checksums
        shell: pwsh
        run: Get-FileHash release\Literature-Agent-*-Windows-x64.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content release\SHA256SUMS.txt -Encoding ascii
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-') }}
          files: |
            release/Literature-Agent-*-Windows-x64.exe
            release/SHA256SUMS.txt
