name: Windows Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create release environment
        shell: pwsh
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install -e "./backend[dev,release]"
          choco install innosetup --no-progress -y
      - name: Test backend
        working-directory: backend
        run: .venv/Scripts/python.exe -m pytest -q
      - name: Install frontend dependencies and Edge browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install msedge
      - name: Build frontend and run browser regression
        working-directory: frontend
        run: |
          npm run build
          npm run test:e2e
      - name: Build installer
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          .\scripts\build-windows-release.ps1 -Version $version
      - name: Create checksums
        shell: pwsh
        run: Get-FileHash release\Literature-Agent-*-Windows-x64.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content release\SHA256SUMS.txt -Encoding ascii
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/Literature-Agent-*-Windows-x64.exe
            release/SHA256SUMS.txt
