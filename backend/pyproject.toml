[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-agent"
version = "0.3.0rc3"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx[socks]>=0.27,<1",
  "pydantic>=2.8,<3",
  "langgraph>=0.2,<1",
  "alembic>=1.14,<2",
  "sqlalchemy>=2.0,<3",
  "typesafe-sdk>=0.7.1,<1",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1"]
release = ["pyinstaller>=6.10,<7"]

[project.scripts]
literature-agent = "literature_agent.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
